<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dibujar Figuras</title>
    <link rel="stylesheet" href="diseño.css">
</head>
<body>

    <h1>Dibujar Triángulos y Rectángulos</h1>
    <h2>Evidencia 2 parte 2</h2>

    <form>
        <label for="figura">Figura:</label>
        <select name="figura" id="figura">
            <option value="triangulo">Triángulo</option>
            <option value="rectangulo">Rectángulo</option>
        </select><br>

        <label for="caracter">Carácter:</label>
        <input type="text" name="caracter" id="caracter" maxlength="1" value="*"><br>

        <!-- Campo para la base (visible solo para rectángulo) -->
        <div id="campo-base" style="display: none;">
            <label for="base">Base:</label>
            <input type="number" name="base" id="base" min="1"><br>
        </div>

        <!-- Campo para la altura (usado por ambas figuras) -->
        <div id="campo-altura">
            <label for="altura">Altura:</label>
            <input type="number" name="altura" id="altura" min="1"><br>
        </div>

        <button type="button" id="dibujar">Dibujar</button>
        <button type="button" id="limpiar">Limpiar</button>

        <br><br>
        <label for="resultado">Resultado:</label><br>
        <textarea id="resultado" rows="10" cols="30" readonly></textarea>
    </form>

    <script src="java.js"></script>
</body>
</html>
