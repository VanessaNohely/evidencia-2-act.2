
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dibujar Figuras</title>
    <link rel="stylesheet" href="diseño.css">
</head>
<body>

    <h1>Dibujar Triángulos y Rectángulos</h1>
    <h2>Evidencia 2, practica 2</h2>

    <form id="formulario">
        <label for="figura">Figura:</label>
        <select id="figura" name="figura">
            <option value="triangulo">Triángulo</option>
            <option value="rectangulo">Rectángulo</option>
        </select>

        <br>

        <label for="caracter">Carácter:</label>
        <input type="text" id="caracter" maxlength="1" value="*"
               required>

        <br>


<div id="campo-base">
    <label for="base">Base:</label>
    <input type="number" id="base" min="1" max="100" required>
    <br>
</div>

<div id="campo-altura">
    <label for="altura">Altura:</label>
    <input type="number" id="altura" min="1" max="100" required>
    <br>
</div>


        <button type="button" id="dibujar">Dibujar</button>
        <button type="button" id="limpiar">Limpiar</button>

        <br><br>

        <label for="resultado">Resultado:</label>
        <br>
        <textarea id="resultado" rows="12" cols="35"
                  readonly></textarea>
    </form>

    <script src="java.js"></script>
</body>
</html>
